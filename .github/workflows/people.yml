name: People extractor

# Triggered by the /people slash command. Renders any people page (headless Chromium,
# so JS-built member lists work), LLM-extracts {name, role, email}, posts back to Slack.
on:
  workflow_dispatch:
    inputs:
      url:
        description: People-page URL
        required: true
      response_url:
        description: Slack response_url to post the result to
        required: false
        default: ""

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Render + extract people
        env:
          PEOPLE_URL: ${{ inputs.url }}
          PEOPLE_RESPONSE_URL: ${{ inputs.response_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python research/people.py
