name: Crimson page watch

on:
  schedule:
    # Each URL is only fetched when ITS own interval (5/30/60/120m, set via /link)
    # is due — so the sweep cron just sets the FINEST achievable tier.
    #   Private repo (now): every 30 min → ~1,440 min/mo, safe under the 2,000 cap.
    #     The 5-min tier is effectively capped at 30 min until the repo is public.
    #   Public repo: change this to "*/5 * * * *" to unlock true 5-min (free minutes).
    #     (GitHub's 5-min cron is best-effort; for rock-solid 5-min, use a loop/host.)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # page snapshots persist between runs via a rolling cache (no repo commits)
      - name: Restore snapshots
        uses: actions/cache/restore@v4
        with:
          path: watch/.state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Check watched pages
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCHLIST_FILE:    watch/watchlist.json
          STATE_FILE:        watch/.state/snapshots.json
          WATCH_WORKERS:     "20"   # concurrent fetches — sized for a ~1,000-link list
        run: python report.py watch
      - name: Save snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch/.state
          key: watch-state-${{ github.run_id }}
