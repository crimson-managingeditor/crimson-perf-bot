name: Crimson page watch

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (tune to taste)
  workflow_dispatch: {}

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # page snapshots persist between runs via a rolling cache (no repo commits)
      - name: Restore snapshots
        uses: actions/cache/restore@v4
        with:
          path: watch/.state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Check watched pages
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCHLIST_FILE:    watch/watchlist.json
          STATE_FILE:        watch/.state/snapshots.json
          WATCH_WORKERS:     "20"   # concurrent fetches — sized for a ~1,000-link list
        run: python report.py watch
      - name: Save snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch/.state
          key: watch-state-${{ github.run_id }}
