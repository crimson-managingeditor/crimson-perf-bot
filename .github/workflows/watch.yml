name: Crimson page watch

on:
  schedule:
    # FALLBACK ONLY. The PRIMARY trigger is a Cloudflare Cron Trigger every 30 min
    # (reliable — GitHub's scheduler drops runs). This sparse cron just covers a
    # Cloudflare outage. Each job still loops internally every 5 min for ~27 min.
    - cron: "13 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write        # to commit watch/changes.log

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}
      - name: Install Chromium (for JS-rendered watches)
        run: python -m playwright install --with-deps chromium
      - name: Restore snapshots
        uses: actions/cache/restore@v4
        with:
          path: watch/.state
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - name: Watch loop (every 5 min for ~27 min)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN:   ${{ secrets.SLACK_BOT_TOKEN }}
          WATCHLIST_FILE:    ${{ runner.temp }}/watchlist.json
          STATE_FILE:        watch/.state/snapshots.json
          WATCH_LOG:         watch/changes.log
          WATCH_WORKERS:     "20"
          GH_TOKEN:          ${{ github.token }}
        run: |
          cp watch/watchlist.json "$RUNNER_TEMP/watchlist.json"
          API="https://api.github.com/repos/${{ github.repository }}/contents/watch/watchlist.json?ref=main"
          END=$(( $(date +%s) + 1620 ))
          N=0
          while :; do
            # refresh the watchlist each pass so newly /link'd pages start within 5 min
            if curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
                 "$API" -o "$RUNNER_TEMP/wl.new" && [ -s "$RUNNER_TEMP/wl.new" ]; then
              mv "$RUNNER_TEMP/wl.new" "$RUNNER_TEMP/watchlist.json"
            fi
            python report.py watch || true
            N=$((N+1))
            # stop before a sleep would push us past the window (avoids a timeout cancel)
            [ $(( $(date +%s) + 300 )) -ge "$END" ] && break
            sleep 300
          done
          echo "completed $N checks"
      - name: Save snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: watch/.state
          key: watch-state-${{ github.run_id }}
      - name: Commit change log
        if: always()
        run: |
          if [ -n "$(git status --porcelain watch/changes.log 2>/dev/null)" ]; then
            git config user.name  "crimson-watch"
            git config user.email "actions@users.noreply.github.com"
            git add watch/changes.log
            git commit -m "watch: change log $(date -u +%FT%TZ)"
            git pull --rebase --quiet origin main || true
            git push || true
          fi
