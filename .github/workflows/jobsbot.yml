name: Harvard jobs firehose

# Polls the SmartRecruiters public postings API for ALL new Harvard job postings and
# posts them to #job-postings.
on:
  schedule:
    - cron: "31 */3 * * *"     # every 3 hours (postings don't move minute-to-minute)
  workflow_dispatch:
    inputs:
      channel:
        description: "Override the Slack channel (blank = #job-postings)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # SLACK_WEBHOOK_URL is deliberately NOT passed -- an incoming webhook only
      # ever posts to the channel it was created for, which is how postings
      # ended up in the analytics feed.
      - name: Poll Harvard postings + alert on new ones
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          JOBS_SLACK_CHANNEL: ${{ github.event.inputs.channel || '#job-postings' }}
        run: python research/jobsbot.py
      - name: Commit state
        if: always()
        run: |
          if [ -n "$(git status --porcelain jobs/seen.json 2>/dev/null)" ]; then
            git config user.name  "crimson-jobs"
            git config user.email "actions@users.noreply.github.com"
            git add jobs/seen.json
            git commit -m "jobs: update $(date -u +%FT%TZ)"
            git pull --rebase --quiet origin main || true
            git push || true
          fi
