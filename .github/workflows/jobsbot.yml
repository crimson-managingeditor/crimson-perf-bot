name: Harvard jobs firehose

# Polls the SmartRecruiters public postings API for ALL new Harvard job postings and
# pings Slack (SLACK_WEBHOOK_URL — point it at your DM or a #jobs channel).
on:
  schedule:
    - cron: "31 */3 * * *"     # every 3 hours (postings don't move minute-to-minute)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll Harvard postings + alert on new ones
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python research/jobsbot.py
      - name: Commit state
        if: always()
        run: |
          if [ -n "$(git status --porcelain jobs/seen.json 2>/dev/null)" ]; then
            git config user.name  "crimson-jobs"
            git config user.email "actions@users.noreply.github.com"
            git add jobs/seen.json
            git commit -m "jobs: update $(date -u +%FT%TZ)"
            git pull --rebase --quiet origin main || true
            git push || true
          fi
