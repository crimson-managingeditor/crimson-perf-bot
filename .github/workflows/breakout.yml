name: Crimson breakout alert

on:
  schedule:
    # Every 30 min during active hours (~7am–11:30pm ET = UTC 11:00–03:30).
    # Tune cadence/window to taste: more frequent = faster alerts, more Actions minutes.
    - cron: "*/30 11-23,0-3 * * *"
  workflow_dispatch: {}

# never run two checks at once (a slow one shouldn't overlap the next tick)
concurrency:
  group: breakout
  cancel-in-progress: false

jobs:
  breakout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # cooldown state persists between runs via a rolling cache (no repo commits)
      - name: Restore cooldown state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: breakout-state-${{ github.run_id }}
          restore-keys: breakout-state-
      - name: Breakout check
        env:
          GA4_PROPERTY_ID:      ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          STATE_FILE:           state/breakout.json
          # thresholds (env-tunable): live readers on one story, its share, cooldown hrs
          BREAKOUT_MIN_ACTIVE:  "150"
          BREAKOUT_MIN_SHARE:   "0.25"
          BREAKOUT_COOLDOWN_H:  "3"
        run: python report.py breakout
      - name: Save cooldown state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: breakout-state-${{ github.run_id }}
