name: Roster tracker

# Scrapes every Harvard varsity roster daily, diffs vs the committed baseline,
# posts adds/drops to #sports-admin, and commits the updated rosters.
on:
  schedule:
    - cron: "17 12 * * *"     # ~08:17 ET daily
  workflow_dispatch:
    inputs:
      channel:
        description: "Override the Slack channel (blank = #sports-admin)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Posting lives in rosters.py now, not in a heredoc here: it's testable
      # locally (`rosters.py ping`) and it shares courtbot's chat.postMessage
      # helper. SLACK_WEBHOOK_URL is deliberately NOT passed -- an incoming
      # webhook only ever posts to the channel it was created for, which is how
      # roster moves ended up in the analytics feed.
      - name: Scrape, diff, and post roster changes
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ROSTER_SLACK_CHANNEL: ${{ github.event.inputs.channel || '#sports-admin' }}
        run: python research/rosters.py track

      - name: Commit updated rosters
        if: always()
        run: |
          if [ -n "$(git status --porcelain research/rosters_data 2>/dev/null)" ]; then
            git config user.name  "crimson-rosters"
            git config user.email "actions@users.noreply.github.com"
            git add research/rosters_data
            git commit -m "rosters: update $(date -u +%FT%TZ)"
            git pull --rebase --quiet origin main || true
            git push || true
          fi
