name: Crimson performance bot

on:
  schedule:
    # Goal: the morning digest at ~9am ET, reliably, year-round.
    # GitHub's scheduler is best-effort and routinely delays/drops runs, so we fire
    # MANY times across 13:00–15:45 UTC (covers the 9–10am ET window in both EDT and
    # EST). The job posts exactly ONCE per day (dedup marker) and only when it's the
    # 9 or 10 o'clock ET hour — so a late fire still posts instead of silently dying.
    - cron: "5,25,45 13,14,15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | ig-daily | ig-weekly | mc-daily"
        default: "daily"
      date:
        description: "backfill/test: treat this date as 'today' (YYYY-MM-DD). Blank = real today."
        default: ""

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore daily post-marker
        uses: actions/cache/restore@v4
        with:
          path: .digest-state
          key: digest-${{ github.run_id }}
          restore-keys: digest-
      - name: Run report
        id: report
        env:
          GA4_PROPERTY_ID:      ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          MAILCHIMP_API_KEY:    ${{ secrets.MAILCHIMP_API_KEY }}
          REPORT_DATE:          ${{ github.event.inputs.date }}
        run: |
          set -e
          run_ig() { [ -n "$IG_ACCESS_TOKEN" ] && (python report.py "$1" || echo "IG $1 failed — continuing") || echo "IG $1 skipped (no token)"; }
          run_mc() { [ -n "$MAILCHIMP_API_KEY" ] && (python report.py "$1" || echo "MC $1 failed — continuing") || echo "MC $1 skipped (no key)"; }
          # Manual runs: honor the chosen mode, any time of day.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python report.py "${{ github.event.inputs.mode }}"
            exit 0
          fi
          # Scheduled: post once, in the 9–10am ET window (tolerates GitHub delays).
          HOUR=$(TZ=America/New_York date +%H)
          case "$HOUR" in
            09|10) ;;
            *) echo "Runtime ${HOUR}:xx ET — outside the 9–10am window, skipping."; exit 0 ;;
          esac
          TODAY=$(TZ=America/New_York date +%F)
          if [ "$(cat .digest-state/last 2>/dev/null)" = "$TODAY" ]; then
            echo "Already posted for $TODAY — skipping duplicate."; exit 0
          fi
          python report.py daily        # article performance
          run_ig ig-daily               # Instagram (separate message)
          run_mc mc-daily               # Mailchimp newsletters (separate message)
          run_ig social-gap             # "share these on IG" (silent if no gaps)
          # Saturdays also get the weekly rollups (%u: 6 = Saturday).
          if [ "$(TZ=America/New_York date +%u)" = "6" ]; then
            python report.py weekly
            run_ig ig-weekly
          fi
          mkdir -p .digest-state; echo "$TODAY" > .digest-state/last
          echo "posted=true" >> "$GITHUB_OUTPUT"
      - name: Save daily post-marker
        if: steps.report.outputs.posted == 'true'
        uses: actions/cache/save@v4
        with:
          path: .digest-state
          key: digest-${{ github.run_id }}
