name: Crimson performance bot

on:
  schedule:
    # Goal: a ping at ~9am ET EVERY morning, year-round.
    # GitHub cron is UTC with no DST awareness, so we fire at BOTH 13:05 (=9am ET
    # in summer/EDT) and 14:05 (=9am ET in winter/EST) and let the job skip the
    # one that isn't in the 9 o'clock ET hour. Minute is off :00 on purpose —
    # GitHub's best-effort scheduler drops top-of-hour runs most often under load.
    - cron: "5 13 * * *"   # 9:05am ET during EDT (summer)
    - cron: "5 14 * * *"   # 9:05am ET during EST (winter)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly | ig-daily | ig-weekly | mc-daily"
        default: "daily"
      date:
        description: "backfill/test: treat this date as 'today' (YYYY-MM-DD). Blank = real today."
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run report
        env:
          GA4_PROPERTY_ID:      ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          MAILCHIMP_API_KEY:    ${{ secrets.MAILCHIMP_API_KEY }}
          REPORT_DATE:          ${{ github.event.inputs.date }}
        run: |
          set -e
          # Instagram/Mailchimp are best-effort: a failure (or missing secret) must
          # never break the article report, so they run guarded.
          run_ig() { [ -n "$IG_ACCESS_TOKEN" ] && (python report.py "$1" || echo "IG $1 failed — continuing") || echo "IG $1 skipped (no token)"; }
          run_mc() { [ -n "$MAILCHIMP_API_KEY" ] && (python report.py "$1" || echo "MC $1 failed — continuing") || echo "MC $1 skipped (no key)"; }
          # Manual runs: honor the chosen mode, any time of day.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python report.py "${{ github.event.inputs.mode }}"
            exit 0
          fi
          # Scheduled: only the fire that lands in the 9 o'clock ET hour posts.
          # This dedupes the 13:05 / 14:05 UTC DST pair down to one 9am ET run.
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$HOUR" != "09" ]; then
            echo "Runtime is ${HOUR}:xx ET, outside the 9am window — skipping (DST off-hour)."
            exit 0
          fi
          python report.py daily        # article performance
          run_ig ig-daily               # Instagram (separate message)
          run_mc mc-daily               # Mailchimp newsletters (separate message)
          run_ig social-gap             # "share these on IG" (needs IG token; silent if no gaps)
          # Saturdays also get the weekly rollups (%u: 6 = Saturday).
          if [ "$(TZ=America/New_York date +%u)" = "6" ]; then
            python report.py weekly
            run_ig ig-weekly
          fi
